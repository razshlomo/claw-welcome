name: One-off fork gate (ee96c670) r2 full-extensions

on:
  push:
    branches: [oneoff/fork-gate-ee96c670-r2]

permissions:
  contents: read

env:
  FORK_REPO: razshlomo/openclaw
  # fork/2026.10.7 head (merge of PR #9): what the PR will merge into
  BASE_SHA: ebfa72e66cde27e75860392f0c4df47b35e44027
  SHARDS: 20

jobs:
  extensions:
    name: full-extensions plan (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 200
    strategy:
      fail-fast: false
      matrix:
        variant: [patched, base]
    steps:
      - uses: actions/checkout@v4
        with: { path: runner }
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.FORK_REPO }}
          ref: ${{ env.BASE_SHA }}
          path: fork
          fetch-depth: 1
          persist-credentials: false
      - name: Apply the change under test
        if: matrix.variant == 'patched'
        working-directory: fork
        run: git -c user.name=gate -c user.email=gate@localhost am "$GITHUB_WORKSPACE/runner/change.patch"
      - uses: pnpm/action-setup@v4
        with: { package_json_file: fork/package.json, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: '24.22.1' }
      - name: Install
        working-directory: fork
        run: pnpm install --frozen-lockfile
      - name: run plan 11 (full-extensions)
        continue-on-error: true
        working-directory: fork
        run: node --import ./scripts/tsx.mjs "$GITHUB_WORKSPACE/runner/run-slice.mts" 0 1 "$RUNNER_TEMP/slice" 11
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ext-${{ matrix.variant }}
          path: |
            ${{ runner.temp }}/slice/results.json
            ${{ runner.temp }}/slice/plan-count.txt
            ${{ runner.temp }}/slice/plan-11.json
