name: One-off fork gate (ee96c670) r8 plan 575 (200 min cap) + plan 528 x3

on:
  push:
    branches: [oneoff/fork-gate-ee96c670-r8]

permissions:
  contents: read

env:
  FORK_REPO: razshlomo/openclaw
  BASE_SHA: ebfa72e66cde27e75860392f0c4df47b35e44027

jobs:
  repeat:
    name: plan ${{ matrix.plan }} (${{ matrix.variant }} ${{ matrix.attempt }})
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        variant: [patched, base]
        plan: [528]
        attempt: [1, 2, 3]
        include:
          - { variant: patched, plan: 575, attempt: 1 }
          - { variant: base, plan: 575, attempt: 1 }
    steps:
      - uses: actions/checkout@v4
        with: { path: runner }
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.FORK_REPO }}
          ref: ${{ env.BASE_SHA }}
          path: fork
          fetch-depth: 1
          persist-credentials: false
      - name: Apply the change under test
        if: matrix.variant == 'patched'
        working-directory: fork
        run: git -c user.name=gate -c user.email=gate@localhost am "$GITHUB_WORKSPACE/runner/change.patch"
      - uses: pnpm/action-setup@v4
        with: { package_json_file: fork/package.json, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: '24.22.1' }
      - name: Install
        working-directory: fork
        run: pnpm install --frozen-lockfile
      - name: run plan
        continue-on-error: true
        env: { GATE_PLAN_TIMEOUT_MIN: '200' }
        working-directory: fork
        run: node --import ./scripts/tsx.mjs "$GITHUB_WORKSPACE/runner/run-leaf.mts" 0 1 "$RUNNER_TEMP/leaf" full-core-tooling,full-core-runtime,full-agentic ${{ matrix.plan }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p${{ matrix.plan }}-${{ matrix.variant }}-${{ matrix.attempt }}
          path: ${{ runner.temp }}/leaf/results.json
