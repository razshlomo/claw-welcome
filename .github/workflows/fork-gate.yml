name: One-off fork gate (ee96c670) r5 codex resident-performance repeat

on:
  push:
    branches: [oneoff/fork-gate-ee96c670-r5]

permissions:
  contents: read

env:
  FORK_REPO: razshlomo/openclaw
  BASE_SHA: ebfa72e66cde27e75860392f0c4df47b35e44027

jobs:
  repeat:
    name: plan 624 (${{ matrix.variant }} ${{ matrix.attempt }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [patched, base]
        attempt: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with: { path: runner }
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.FORK_REPO }}
          ref: ${{ env.BASE_SHA }}
          path: fork
          fetch-depth: 1
          persist-credentials: false
      - name: Apply the change under test
        if: matrix.variant == 'patched'
        working-directory: fork
        run: git -c user.name=gate -c user.email=gate@localhost am "$GITHUB_WORKSPACE/runner/change.patch"
      - uses: pnpm/action-setup@v4
        with: { package_json_file: fork/package.json, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: '24.22.1' }
      - name: Install
        working-directory: fork
        run: pnpm install --frozen-lockfile
      - name: run plan 624
        continue-on-error: true
        working-directory: fork
        run: node --import ./scripts/tsx.mjs "$GITHUB_WORKSPACE/runner/run-leaf.mts" 0 1 "$RUNNER_TEMP/leaf" full-extensions 624
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rep-${{ matrix.variant }}-${{ matrix.attempt }}
          path: ${{ runner.temp }}/leaf/results.json
