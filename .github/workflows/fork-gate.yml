name: One-off fork gate (ee96c670) r6 base reruns of r3 failed leaf plans (parallel)

on:
  push:
    branches: [oneoff/fork-gate-ee96c670-r6]

permissions:
  contents: read

env:
  FORK_REPO: razshlomo/openclaw
  BASE_SHA: ebfa72e66cde27e75860392f0c4df47b35e44027

jobs:
  repeat:
    name: base plan ${{ matrix.plan }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        plan: [303, 483, 187, 116, 592, 575, 160, 528]
    steps:
      - uses: actions/checkout@v4
        with: { path: runner }
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.FORK_REPO }}
          ref: ${{ env.BASE_SHA }}
          path: fork
          fetch-depth: 1
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with: { package_json_file: fork/package.json, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: '24.22.1' }
      - name: Install
        working-directory: fork
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium || true
      - name: run plan on base
        continue-on-error: true
        working-directory: fork
        run: node --import ./scripts/tsx.mjs "$GITHUB_WORKSPACE/runner/run-leaf.mts" 0 1 "$RUNNER_TEMP/leaf" full-core-tooling,full-core-runtime,full-agentic ${{ matrix.plan }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: base-plan-${{ matrix.plan }}
          path: ${{ runner.temp }}/leaf/results.json
